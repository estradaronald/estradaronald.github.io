```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Pinoy Budots Cat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 50% 30%, #4b0082, transparent 35%),
                linear-gradient(135deg, #12001f, #050505);

            color: white;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #ff00ff;
        }

        .subtitle {
            margin-bottom: 25px;
            opacity: .8;
        }

        /* =========================
           STAGE
        ========================= */

        .stage {
            position: relative;
            width: 350px;
            height: 420px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .floor {
            position: absolute;
            bottom: 20px;
            width: 300px;
            height: 35px;
            border-radius: 50%;
            background: #ffffff22;
            box-shadow:
                0 0 25px #ff00ff,
                0 0 50px #00ffff;
        }

        /* =========================
           CAT
        ========================= */

        .cat {
            position: relative;
            width: 180px;
            height: 330px;
            transform-origin: bottom center;
        }

        /* HEAD */

        .head {
            position: absolute;
            width: 150px;
            height: 125px;
            left: 15px;
            top: 5px;

            background: #f4a261;
            border-radius: 50%;
            z-index: 5;

            box-shadow: inset -8px -8px #d47b3f;
        }

        /* EARS */

        .ear {
            position: absolute;
            width: 55px;
            height: 65px;
            top: -25px;

            background: #f4a261;
            z-index: -1;
        }

        .ear.left {
            left: 8px;
            transform: rotate(-30deg);
            border-radius: 10px 45px 5px 5px;
        }

        .ear.right {
            right: 8px;
            transform: rotate(30deg);
            border-radius: 45px 10px 5px 5px;
        }

        .ear::after {
            content: "";
            position: absolute;

            width: 30px;
            height: 40px;

            left: 13px;
            top: 12px;

            background: #ff8fab;
            border-radius: 15px;
        }

        /* EYES */

        .eye {
            position: absolute;
            top: 42px;

            width: 24px;
            height: 30px;

            background: #111;
            border-radius: 50%;
        }

        .eye.left {
            left: 35px;
        }

        .eye.right {
            right: 35px;
        }

        .eye::after {
            content: "";

            position: absolute;
            width: 7px;
            height: 7px;

            top: 5px;
            left: 5px;

            background: white;
            border-radius: 50%;
        }

        /* NOSE */

        .nose {
            position: absolute;

            width: 18px;
            height: 14px;

            top: 74px;
            left: 66px;

            background: #ff6b81;
            border-radius: 50%;
        }

        /* MOUTH */

        .mouth {
            position: absolute;

            width: 30px;
            height: 17px;

            top: 87px;
            left: 60px;

            border-bottom: 3px solid #222;
            border-radius: 50%;
        }

        /* =========================
           BODY
        ========================= */

        .body {
            position: absolute;

            width: 115px;
            height: 145px;

            left: 33px;
            top: 110px;

            background: #f4a261;
            border-radius: 45% 45% 35% 35%;

            box-shadow: inset -8px -8px #d47b3f;

            z-index: 2;
        }

        .belly {
            position: absolute;

            width: 75px;
            height: 100px;

            left: 20px;
            top: 25px;

            background: #ffd6a5;
            border-radius: 50%;
        }

        /* =========================
           ARMS
        ========================= */

        .arm {
            position: absolute;

            width: 28px;
            height: 105px;

            top: 125px;

            background: #f4a261;
            border-radius: 20px;

            transform-origin: top center;

            z-index: 1;
        }

        .arm.left {
            left: 20px;
        }

        .arm.right {
            right: 20px;
        }

        /* =========================
           LEGS
        ========================= */

        .leg {
            position: absolute;

            width: 38px;
            height: 95px;

            top: 235px;

            background: #f4a261;
            border-radius: 20px;

            transform-origin: top center;

            z-index: 1;
        }

        .leg.left {
            left: 42px;
        }

        .leg.right {
            right: 42px;
        }

        /* =========================
           TAIL
        ========================= */

        .tail {
            position: absolute;

            width: 115px;
            height: 35px;

            right: -75px;
            top: 180px;

            border: 12px solid #f4a261;
            border-left: none;

            border-radius: 0 50px 50px 0;

            transform-origin: left center;

            z-index: 0;
        }

        /* =========================
           BUDOTS DANCE
        ========================= */

        .cat.dancing {
            animation: budotsBody .35s infinite alternate ease-in-out;
        }

        .cat.dancing .head {
            animation: budotsHead .35s infinite alternate ease-in-out;
        }

        .cat.dancing .body {
            animation: hipShake .22s infinite alternate ease-in-out;
        }

        .cat.dancing .arm.left {
            animation: leftArm .25s infinite alternate ease-in-out;
        }

        .cat.dancing .arm.right {
            animation: rightArm .25s infinite alternate ease-in-out;
        }

        .cat.dancing .leg.left {
            animation: leftLeg .22s infinite alternate ease-in-out;
        }

        .cat.dancing .leg.right {
            animation: rightLeg .22s infinite alternate ease-in-out;
        }

        .cat.dancing .tail {
            animation: tailShake .2s infinite alternate ease-in-out;
        }

        /* BODY BOUNCE */

        @keyframes budotsBody {

            0% {
                transform:
                    translateY(5px)
                    rotate(-3deg)
                    scaleY(.96);
            }

            50% {
                transform:
                    translateY(-5px)
                    rotate(0deg)
                    scaleY(1);
            }

            100% {
                transform:
                    translateY(10px)
                    rotate(3deg)
                    scaleY(.94);
            }
        }

        /* HEAD */

        @keyframes budotsHead {

            0% {
                transform: rotate(-8deg);
            }

            100% {
                transform: rotate(8deg);
            }
        }

        /* HIPS */

        @keyframes hipShake {

            0% {
                transform: translateX(-12px) rotate(-4deg);
            }

            100% {
                transform: translateX(12px) rotate(4deg);
            }
        }

        /* ARMS */

        @keyframes leftArm {

            0% {
                transform: rotate(55deg);
            }

            100% {
                transform: rotate(-65deg);
            }
        }

        @keyframes rightArm {

            0% {
                transform: rotate(-65deg);
            }

            100% {
                transform: rotate(55deg);
            }
        }

        /* LEGS */

        @keyframes leftLeg {

            0% {
                transform:
                    rotate(18deg)
                    translateY(0);
            }

            100% {
                transform:
                    rotate(-18deg)
                    translateY(10px);
            }
        }

        @keyframes rightLeg {

            0% {
                transform:
                    rotate(-18deg)
                    translateY(10px);
            }

            100% {
                transform:
                    rotate(18deg)
                    translateY(0);
            }
        }

        /* TAIL */

        @keyframes tailShake {

            0% {
                transform: rotate(-45deg);
            }

            100% {
                transform: rotate(45deg);
            }
        }

        /* =========================
           BUTTON
        ========================= */

        button {
            margin-top: 15px;

            padding: 16px 35px;

            border: none;
            border-radius: 50px;

            background: linear-gradient(
                90deg,
                #ff006e,
                #8338ec,
                #3a86ff
            );

            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 15px #ff006e,
                0 0 30px #8338ec;

            transition: .2s;
        }

        button:hover {
            transform: scale(1.08);
        }

        button:active {
            transform: scale(.95);
        }

        /* =========================
           MUSIC NOTES
        ========================= */

        .note {
            position: absolute;

            font-size: 35px;

            animation: floatingNotes 2s infinite ease-in-out;

            opacity: .8;
        }

        .note.one {
            left: 15%;
            top: 25%;
        }

        .note.two {
            right: 15%;
            top: 35%;
            animation-delay: .5s;
        }

        .note.three {
            left: 20%;
            top: 65%;
            animation-delay: 1s;
        }

        @keyframes floatingNotes {

            0% {
                transform: translateY(0) rotate(0);
            }

            50% {
                transform: translateY(-30px) rotate(20deg);
            }

            100% {
                transform: translateY(0) rotate(0);
            }
        }

        /* =========================
           DISCO LIGHTS
        ========================= */

        body.dancing {
            animation: disco .25s infinite alternate;
        }

        @keyframes disco {

            0% {
                background:
                    radial-gradient(
                        circle at 20% 30%,
                        #ff006e55,
                        transparent 30%
                    ),
                    #140020;
            }

            100% {
                background:
                    radial-gradient(
                        circle at 80% 40%,
                        #00ffff55,
                        transparent 30%
                    ),
                    #00142a;
            }
        }

    </style>
</head>

<body>

    <h1>🐱 BUDOTS CAT</h1>

    <div class="subtitle">
        🇵🇭 PINOY DANCE MODE 🇵🇭
    </div>

    <div class="stage">

        <div class="floor"></div>

        <div class="cat" id="cat">

            <!-- HEAD -->
            <div class="head">

                <div class="ear left"></div>
                <div class="ear right"></div>

                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="nose"></div>
                <div class="mouth"></div>

            </div>

            <!-- BODY -->
            <div class="body">
                <div class="belly"></div>
            </div>

            <!-- ARMS -->
            <div class="arm left"></div>
            <div class="arm right"></div>

            <!-- LEGS -->
            <div class="leg left"></div>
            <div class="leg right"></div>

            <!-- TAIL -->
            <div class="tail"></div>

        </div>

    </div>

    <div class="note one">🎵</div>
    <div class="note two">♫</div>
    <div class="note three">🎶</div>

    <button id="danceButton">
        🔥 START BUDOTS 🔥
    </button>


    <script>

        const cat = document.getElementById("cat");
        const button = document.getElementById("danceButton");

        let dancing = false;

        button.addEventListener("click", () => {

            dancing = !dancing;

            if (dancing) {

                cat.classList.add("dancing");
                document.body.classList.add("dancing");

                button.textContent = "🛑 STOP BUDOTS";

            } else {

                cat.classList.remove("dancing");
                document.body.classList.remove("dancing");

                button.textContent = "🔥 START BUDOTS 🔥";

            }

        });

    </script>

</body>
</html>
```
