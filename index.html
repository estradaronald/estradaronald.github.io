```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Dancing Cat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, #ff4ecd55, transparent 25%),
                radial-gradient(circle at 80% 30%, #4dffff55, transparent 25%),
                linear-gradient(135deg, #12002b, #25005c, #09001a);

            color: white;
        }

        h1 {
            margin-bottom: 35px;
            font-size: 42px;
            text-shadow: 0 0 15px #fff;
        }

        .stage {
            width: 350px;
            height: 430px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* =========================
           CAT
        ========================= */

        .cat {
            position: relative;
            width: 180px;
            height: 300px;
            transform-origin: bottom center;
        }

        /* Head */

        .head {
            position: absolute;
            width: 150px;
            height: 125px;
            left: 15px;
            top: 15px;
            background: #f4a261;
            border-radius: 50%;
            z-index: 5;
            box-shadow: inset -8px -8px 0 #d98245;
        }

        /* Ears */

        .ear {
            position: absolute;
            width: 55px;
            height: 65px;
            background: #f4a261;
            top: -25px;
            z-index: -1;
        }

        .ear.left {
            left: 8px;
            transform: rotate(-30deg);
            border-radius: 10px 45px 5px 5px;
        }

        .ear.right {
            right: 8px;
            transform: rotate(30deg);
            border-radius: 45px 10px 5px 5px;
        }

        .ear::after {
            content: "";
            position: absolute;
            width: 30px;
            height: 40px;
            background: #ff8fab;
            top: 12px;
            left: 13px;
            border-radius: 10px 25px 5px 5px;
        }

        /* Eyes */

        .eye {
            position: absolute;
            width: 25px;
            height: 30px;
            top: 43px;
            background: #111;
            border-radius: 50%;
        }

        .eye.left {
            left: 35px;
        }

        .eye.right {
            right: 35px;
        }

        .eye::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
            top: 5px;
            left: 5px;
        }

        /* Nose */

        .nose {
            position: absolute;
            width: 18px;
            height: 14px;
            background: #ff6b81;
            left: 66px;
            top: 75px;
            border-radius: 50% 50% 60% 60%;
        }

        /* Mouth */

        .mouth {
            position: absolute;
            width: 30px;
            height: 15px;
            left: 60px;
            top: 88px;
            border-bottom: 3px solid #222;
            border-radius: 50%;
        }

        /* Whiskers */

        .whisker {
            position: absolute;
            width: 45px;
            height: 2px;
            background: #333;
            top: 80px;
        }

        .whisker.w1 {
            left: -25px;
            transform: rotate(10deg);
        }

        .whisker.w2 {
            left: -25px;
            top: 90px;
            transform: rotate(-5deg);
        }

        .whisker.w3 {
            right: -25px;
            transform: rotate(-10deg);
        }

        .whisker.w4 {
            right: -25px;
            top: 90px;
            transform: rotate(5deg);
        }

        /* Body */

        .body {
            position: absolute;
            width: 115px;
            height: 145px;
            left: 33px;
            top: 120px;
            background: #f4a261;
            border-radius: 45% 45% 35% 35%;
            box-shadow: inset -8px -8px 0 #d98245;
            z-index: 2;
        }

        /* Belly */

        .belly {
            position: absolute;
            width: 75px;
            height: 100px;
            background: #ffd6a5;
            border-radius: 50%;
            left: 20px;
            top: 25px;
        }

        /* Arms */

        .arm {
            position: absolute;
            width: 28px;
            height: 105px;
            background: #f4a261;
            top: 135px;
            border-radius: 20px;
            z-index: 1;
            transform-origin: top center;
        }

        .arm.left {
            left: 20px;
        }

        .arm.right {
            right: 20px;
        }

        /* Legs */

        .leg {
            position: absolute;
            width: 35px;
            height: 100px;
            background: #f4a261;
            top: 245px;
            border-radius: 20px;
            z-index: 1;
            transform-origin: top center;
        }

        .leg.left {
            left: 45px;
        }

        .leg.right {
            right: 45px;
        }

        /* Paws */

        .paw {
            position: absolute;
            width: 38px;
            height: 25px;
            background: #f4a261;
            border-radius: 50%;
        }

        /* Tail */

        .tail {
            position: absolute;
            width: 110px;
            height: 30px;
            border: 12px solid #f4a261;
            border-left: none;
            border-radius: 0 50px 50px 0;
            right: -70px;
            top: 195px;
            transform: rotate(-20deg);
            transform-origin: left center;
            z-index: 0;
        }

        /* =========================
           DANCE ANIMATION
        ========================= */

        .cat.dancing {
            animation: bodyDance 0.5s infinite alternate ease-in-out;
        }

        .cat.dancing .head {
            animation: headDance 0.5s infinite alternate ease-in-out;
        }

        .cat.dancing .arm.left {
            animation: leftArm 0.4s infinite alternate ease-in-out;
        }

        .cat.dancing .arm.right {
            animation: rightArm 0.4s infinite alternate ease-in-out;
        }

        .cat.dancing .leg.left {
            animation: leftLeg 0.5s infinite alternate ease-in-out;
        }

        .cat.dancing .leg.right {
            animation: rightLeg 0.5s infinite alternate ease-in-out;
        }

        .cat.dancing .tail {
            animation: tailDance 0.4s infinite alternate ease-in-out;
        }

        @keyframes bodyDance {
            0% {
                transform: translateY(0) rotate(-6deg);
            }

            100% {
                transform: translateY(-20px) rotate(6deg);
            }
        }

        @keyframes headDance {
            0% {
                transform: rotate(-8deg);
            }

            100% {
                transform: rotate(8deg);
            }
        }

        @keyframes leftArm {
            0% {
                transform: rotate(35deg);
            }

            100% {
                transform: rotate(-55deg);
            }
        }

        @keyframes rightArm {
            0% {
                transform: rotate(-35deg);
            }

            100% {
                transform: rotate(55deg);
            }
        }

        @keyframes leftLeg {
            0% {
                transform: rotate(15deg);
            }

            100% {
                transform: rotate(-20deg);
            }
        }

        @keyframes rightLeg {
            0% {
                transform: rotate(-15deg);
            }

            100% {
                transform: rotate(20deg);
            }
        }

        @keyframes tailDance {
            0% {
                transform: rotate(-35deg);
            }

            100% {
                transform: rotate(35deg);
            }
        }

        /* =========================
           BUTTON
        ========================= */

        button {
            margin-top: 20px;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #25005c;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px #ffffff88;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px white;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Disco floor */

        .floor {
            position: absolute;
            bottom: 20px;
            width: 330px;
            height: 20px;
            background: #ffffff33;
            border-radius: 50%;
            box-shadow: 0 0 30px #fff;
        }

        /* Floating music notes */

        .note {
            position: absolute;
            font-size: 35px;
            animation: float 3s infinite ease-in-out;
            opacity: 0.7;
        }

        .note.one {
            left: 20%;
            top: 20%;
        }

        .note.two {
            right: 20%;
            top: 30%;
            animation-delay: 1s;
        }

        .note.three {
            left: 15%;
            top: 60%;
            animation-delay: 2s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-30px) rotate(15deg);
            }

            100% {
                transform: translateY(0) rotate(0deg);
            }
        }
    </style>
</head>

<body>

    <h1>🐱 Dancing Cat</h1>

    <div class="stage">

        <div class="floor"></div>

        <div class="cat" id="cat">

            <!-- Head -->
            <div class="head">

                <div class="ear left"></div>
                <div class="ear right"></div>

                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="nose"></div>
                <div class="mouth"></div>

                <div class="whisker w1"></div>
                <div class="whisker w2"></div>
                <div class="whisker w3"></div>
                <div class="whisker w4"></div>

            </div>

            <!-- Body -->
            <div class="body">
                <div class="belly"></div>
            </div>

            <!-- Arms -->
            <div class="arm left"></div>
            <div class="arm right"></div>

            <!-- Legs -->
            <div class="leg left"></div>
            <div class="leg right"></div>

            <!-- Tail -->
            <div class="tail"></div>

        </div>

    </div>

    <div class="note one">♪</div>
    <div class="note two">♫</div>
    <div class="note three">♪</div>

    <button id="danceButton">💃 MAKE CAT DANCE 🕺</button>

    <script>
        const cat = document.getElementById("cat");
        const button = document.getElementById("danceButton");

        let dancing = false;

        button.addEventListener("click", () => {

            dancing = !dancing;

            if (dancing) {
                cat.classList.add("dancing");
                button.textContent = "🛑 STOP THE CAT";
            } else {
                cat.classList.remove("dancing");
                button.textContent = "💃 MAKE CAT DANCE 🕺";
            }

        });
    </script>

</body>
</html>
```
