<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Growing Flower</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(#87ceeb, #dff6ff);
        display: flex;
        justify-content: center;
        align-items: flex-end;
    }

    .ground {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 15vh;
        background: #5c913b;
    }

    .flower {
        position: absolute;
        bottom: 15vh;
        width: 20px;
        height: 0;
        transform-origin: bottom;
        animation: growStem 3s ease-out forwards;
    }

    /* STEM */
    .stem {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 8px;
        height: 0;
        background: #3f7d32;
        border-radius: 10px;
        transform: translateX(-50%);
        animation: stemGrow 3s ease-out forwards;
    }

    /* FLOWER HEAD */
    .flower-head {
        position: absolute;
        bottom: 100%;
        left: 50%;
        width: 20px;
        height: 20px;
        transform: translate(-50%, 50%) scale(0);
        animation: bloom 2s ease-out 3s forwards;
    }

    /* PETALS */
    .petal {
        position: absolute;

        width: 45px;
        height: 65px;

        background: #ff5c8a;

        border-radius: 50%;

        left: 50%;
        top: 50%;

        transform-origin: 50% 100%;

        transform:
            translate(-50%, -100%)
            rotate(var(--rotation))
            scale(0);

        animation:
            petalBloom 1s ease-out 3.5s forwards;
    }

    .petal:nth-child(1) {
        --rotation: 0deg;
    }

    .petal:nth-child(2) {
        --rotation: 45deg;
    }

    .petal:nth-child(3) {
        --rotation: 90deg;
    }

    .petal:nth-child(4) {
        --rotation: 135deg;
    }

    .petal:nth-child(5) {
        --rotation: 180deg;
    }

    .petal:nth-child(6) {
        --rotation: 225deg;
    }

    .petal:nth-child(7) {
        --rotation: 270deg;
    }

    .petal:nth-child(8) {
        --rotation: 315deg;
    }

    /* CENTER */
    .center {
        position: absolute;

        width: 32px;
        height: 32px;

        background: #ffd447;

        border-radius: 50%;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%) scale(0);

        z-index: 10;

        animation: centerBloom 1s ease-out 4s forwards;
    }

    /* LEAVES */
    .leaf {
        position: absolute;

        width: 45px;
        height: 22px;

        background: #4c9639;

        border-radius: 100% 0;

        opacity: 0;

        animation: leafAppear 1s ease-out 2s forwards;
    }

    .leaf.left {
        left: -35px;
        bottom: 40%;
        transform: rotate(-30deg);
    }

    .leaf.right {
        right: -35px;
        bottom: 55%;
        transform: rotate(30deg) scaleX(-1);
    }

    /* ANIMATIONS */

    @keyframes stemGrow {
        from {
            height: 0;
        }

        to {
            height: 250px;
        }
    }

    @keyframes growStem {
        from {
            transform: scaleY(0);
        }

        to {
            transform: scaleY(1);
        }
    }

    @keyframes bloom {
        from {
            transform: translate(-50%, 50%) scale(0);
        }

        to {
            transform: translate(-50%, 50%) scale(1);
        }
    }

    @keyframes petalBloom {
        from {
            transform:
                translate(-50%, -100%)
                rotate(var(--rotation))
                scale(0);
        }

        to {
            transform:
                translate(-50%, -100%)
                rotate(var(--rotation))
                scale(1);
        }
    }

    @keyframes centerBloom {
        from {
            transform: translate(-50%, -50%) scale(0);
        }

        to {
            transform: translate(-50%, -50%) scale(1);
        }
    }

    @keyframes leafAppear {
        from {
            opacity: 0;
            transform: scale(0);
        }

        to {
            opacity: 1;
        }
    }
</style>
</head>

<body>

    <div class="ground"></div>

    <div class="flower">

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="flower-head">

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>

            <div class="center"></div>

        </div>

    </div>

</body>
</html>
